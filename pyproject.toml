[tool.poetry]
name = "serverless-mcp-aws"
version = "0.1.0"
description = "Run an MCP server on AWS Lambda behind API Gateway (HTTP API) with stateless Streamable HTTP, JWT bearer auth (RS256/ES256, JWKS), per-scope tool allowlists, OAuth protected resource metadata and an AWS CDK construct."
authors = ["Martín Castro Álvarez <martincastro.10.5@gmail.com>"]
license = "MIT"
readme = "README.md"
homepage = "https://github.com/MartinCastroAlvarez/serverless-mcp-aws"
repository = "https://github.com/MartinCastroAlvarez/serverless-mcp-aws"
documentation = "https://github.com/MartinCastroAlvarez/serverless-mcp-aws#readme"
keywords = [
    "mcp",
    "model-context-protocol",
    "aws-lambda",
    "api-gateway",
    "serverless",
    "aws-cdk",
    "jwt",
    "oauth2",
    "streamable-http",
    "ai-agents",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Web Environment",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Internet :: WWW/HTTP :: HTTP Servers",
    "Topic :: Security",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Typing :: Typed",
]
packages = [{ include = "serverless_mcp_aws" }]
include = [
    { path = "LICENSE", format = ["sdist", "wheel"] },
]

[tool.poetry.scripts]
serverless-mcp-aws = "serverless_mcp_aws.cli:main"

[tool.poetry.dependencies]
python = "^3.11"
mcp = "^2.3"
pyjwt = { version = "^2.10", extras = ["crypto"] }
# The CDK construct: `pip install "serverless-mcp-aws[cdk]"`.
aws-cdk-lib = { version = "^2.200", optional = true }
constructs = { version = "^10.4", optional = true }

[tool.poetry.extras]
cdk = ["aws-cdk-lib", "constructs"]

[tool.poetry.group.dev.dependencies]
pytest = "^9.0"
pytest-cov = ">=5,<8"
moto = { version = "^5.1", extras = ["s3"] }
boto3 = "^1.35"
ruff = ">=0.6"
mypy = "^1.11 || ^2.0"
bandit = "^1.7"
pip-audit = "^2.7"
boto3-stubs = { version = "^1.35", extras = ["s3"] }

[build-system]
requires = ["poetry-core>=1.6.0"]
build-backend = "poetry.core.masonry.api"

# --------------------------------------------------------------------------- #
# Ruff — lint + format
# --------------------------------------------------------------------------- #
[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = [
    "E", "W",       # pycodestyle
    "F",            # pyflakes
    "I",            # isort
    "B",            # bugbear
    "S",            # bandit-style security
    "UP",           # pyupgrade
    "SIM",          # simplify
    "RET",          # returns
    "PIE",          # misc
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["E402", "S101", "S104", "S105", "S106", "S108", "S310", "S603", "E501"]
"examples/**/*.py" = ["S101", "S105", "S106"]

[tool.ruff.lint.isort]
force-single-line = true
known-first-party = ["serverless_mcp_aws", "tests", "examples"]

# --------------------------------------------------------------------------- #
# Pytest
# --------------------------------------------------------------------------- #
[tool.pytest.ini_options]
python_files = ["test_*.py"]
addopts = [
    "-ra",
    "--strict-markers",
    "--strict-config",
    "--cov=serverless_mcp_aws",
    "--cov-report=term-missing",
]
testpaths = ["tests"]
markers = [
    "cdk: synthesises CDK stacks (needs the cdk extra and Node.js)",
]
filterwarnings = ["error"]

# --------------------------------------------------------------------------- #
# MyPy
# --------------------------------------------------------------------------- #
[tool.mypy]
python_version = "3.11"
strict = true
warn_unused_ignores = true
warn_redundant_casts = true

[[tool.mypy.overrides]]
module = ["moto", "moto.*"]
ignore_missing_imports = true

# aws-cdk-lib's generated stubs take several GB of RAM to type-check; treat
# the CDK as untyped (the construct is covered by CDK assertion tests).
[[tool.mypy.overrides]]
module = ["aws_cdk", "aws_cdk.*"]
follow_imports = "skip"
follow_imports_for_stubs = true

# --------------------------------------------------------------------------- #
# Coverage
# --------------------------------------------------------------------------- #
[tool.coverage.run]
branch = true
source = ["serverless_mcp_aws"]

[tool.coverage.report]
fail_under = 85
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "if __name__ == .__main__.:",
]
omit = [
    "serverless_mcp_aws/__main__.py",
]

# --------------------------------------------------------------------------- #
# Bandit
# --------------------------------------------------------------------------- #
[tool.bandit]
exclude_dirs = ["tests", "examples", ".venv", "build", "dist"]
