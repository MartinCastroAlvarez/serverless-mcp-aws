name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint (ruff + mypy + bandit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install Poetry
        run: pipx install poetry
      - name: Install dependencies
        run: poetry install --no-interaction --all-extras
      - name: ruff check
        run: poetry run ruff check serverless_mcp_aws tests examples
      - name: ruff format --check
        run: poetry run ruff format --check serverless_mcp_aws tests examples
      - name: mypy
        run: poetry run mypy serverless_mcp_aws
      - name: bandit
        run: poetry run bandit -c pyproject.toml -q -r serverless_mcp_aws

  audit:
    name: pip-audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install Poetry
        run: pipx install poetry
      - name: Install dependencies
        run: poetry install --no-interaction --no-root --all-extras
      - name: pip-audit
        run: |
          # Upgrade pip first so its own advisories don't fail the audit -
          # pip is tooling, not a shipped dependency.
          poetry run python -m pip install --upgrade -q pip
          poetry run pip-audit

  test:
    name: Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      # The CDK construct synthesises through jsii, which needs Node.js.
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - name: Install Poetry
        run: pipx install poetry
      - name: Install dependencies
        run: poetry install --no-interaction --all-extras
      - name: Run pytest (adapter, JWT attacks, MCP client e2e, moto, CDK assertions)
        run: poetry run pytest -q
      - name: Local demo (fake IdP + moto + dev server + MCP client)
        run: poetry run python -m examples.local_demo

  core-only:
    name: Tests without the cdk extra
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install Poetry
        run: pipx install poetry
      - name: Install dependencies
        run: poetry install --no-interaction
      - name: Run pytest (CDK tests skip)
        run: poetry run pytest -q --cov-fail-under=80
